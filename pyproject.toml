[project]
name = "movieflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.15",
    "graphviz>=0.21",
    "loguru>=0.7.3",
    "matplotlib>=3.10.0",
    "mlflow>=3.12.0",
    "opencv-python>=4.13.0.92",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "requests>=2.32.5",
    "safetensors>=0.7.0",
    "timm>=1.0.27",
    "torch>=2.6.0",
    "torchview>=0.2.7",
    "tqdm>=4.67.3",
]


# Сборки torch/torchvision с CUDA (см. https://pytorch.org/get-started/locally/ )
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
